<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>板块估值数据</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {padding: 20px; font-family: Microsoft Yahei;}
        table {border-collapse: collapse; width: 100%; margin-top: 20px;}
        th,td {border: 1px solid #999; padding: 8px 12px; text-align: center;}
        th {background: #f5f5f5;}
    </style>
</head>
<body>
    <h2>东方财富板块估值（每日自动更新）</h2>
    <div id="loading">正在加载数据...</div>
    <div id="table-box"></div>

    <script>
        // 替换为你仓库的 raw 地址
        const csvUrl = "./data/pe_history.csv";
        fetch(csvUrl)
            .then(res => res.text())
            .then(csv => {
                document.getElementById("loading").innerText = "";
                const wb = XLSX.read(csv, {type:"string"});
                const sheet = wb.Sheets[wb.SheetNames[0]];
                document.getElementById("table-box").innerHTML = XLSX.utils.sheet_to_html(sheet);
            })
            .catch(err => {
                document.getElementById("loading").innerText = "数据加载失败，请稍后重试";
                console.error(err);
            })
    </script>
</body>
</html>
