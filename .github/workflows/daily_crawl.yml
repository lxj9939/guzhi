name: 每日板块估值更新
on:
  schedule:
    # UTC时间 02:00 = 北京时间 10:00，可自行修改
    - cron: '0 6 * * *'
  workflow_dispatch: # 支持手动点击立即运行

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行爬取脚本
        run: python crawl.py

      - name: 提交更新到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "自动更新估值数据: $(date +'%Y-%m-%d %H:%M')"
          git push
